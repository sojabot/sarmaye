<!DOCTYPE html>
<html dir="rtl" lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب روش پرداخت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazir, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Vazir, sans-serif;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .content {
            padding: 30px;
        }

        .payment-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .payment-option:hover {
            border-color: #4CAF50;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .payment-option h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .payment-option p {
            color: #6c757d;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .payment-form {
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: Vazir, sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            font-family: Vazir, sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(23, 162, 184, 0.4);
        }

        .icon {
            font-size: 1.5rem;
            margin-left: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #6c757d;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 15px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .container {
                border-radius: 15px;
            }

            .content {
                padding: 20px;
            }

            .payment-option {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 25px 15px;
            }

            .content {
                padding: 15px;
            }

            .payment-option {
                padding: 15px;
            }

            .btn {
                padding: 12px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-credit-card icon"></i>انتخاب روش پرداخت</h1>
            <p>روش مورد نظر خود را برای پرداخت انتخاب کنید</p>
        </div>

        <div class="content">
            <!-- پرداخت از طریق درگاه زیبال -->
            <div class="payment-option">
                <h3><i class="fas fa-wifi icon"></i>پرداخت آنلاین</h3>
                <p>پرداخت امن و سریع از طریق درگاه بانکی زیبال</p>
                <form action="/start_payment" method="post" class="payment-form">
                    <div class="form-group">
                        <label for="total_price">مبلغ پرداخت (تومان)</label>
                        <input type="number" id="total_price" name="total_price" required min="1000"
                            placeholder="مثال: 100000">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-lock icon"></i>پرداخت امن
                    </button>
                </form>
            </div>

            <!-- پرداخت کارت به کارت -->
            <div class="payment-option">
                <h3><i class="fas fa-exchange-alt icon"></i>پرداخت کارت به کارت</h3>
                <p>واریز مبلغ به حساب بانکی و ارسال رسید</p>
                <a href="/bank_transfer" class="btn btn-info">
                    <i class="fas fa-university icon"></i>مشاهده اطلاعات حساب
                </a>
            </div>

            <!-- دکمه بازگشت -->
            <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-right icon"></i>بازگشت به خانه
            </a>
        </div>
    </div>
</body>

</html>
