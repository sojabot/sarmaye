{% extends "2base.html" %}

{% block title %}ارسال پیام جدید{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">
                    <i class="fas fa-paper-plane me-2"></i>
                    ارسال پیام جدید
                </h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="text" class="form-label">متن پیام</label>
                        <textarea class="form-control" id="text" name="text" rows="5"
                            placeholder="متن پیام خود را اینجا بنویسید..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="file" class="form-label">ضمیمه فایل (اختیاری)</label>
                        <input class="form-control" type="file" id="file" name="file"
                            accept=".png,.jpg,.jpeg,.gif,.pdf,.doc,.docx">
                        <div class="form-text">فرمت‌های مجاز: PNG, JPG, JPEG, GIF, PDF, DOC, DOCX - حداکثر حجم: ۱۶
                            مگابایت</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('message.my_messages') }}" class="btn btn-secondary me-md-2">
                            <i class="fas fa-arrow-right me-1"></i>
                            بازگشت
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-1"></i>
                            ارسال پیام
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
